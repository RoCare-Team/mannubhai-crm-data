<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mannubhai Service Expert – Business Control Center</title>
<style>
:root{--bg:#eef2f8;--cd:#fff;--tx:#0b1f3a;--mu:#5b6b82;--bd:#d9e1ee;--nv:#0b1f3a;--bl:#1d5fd0;--gr:#0b8f6a;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08121f;--cd:#10233b;--tx:#e8eef8;--mu:#93a4bd;--bd:#223a58;--nv:#050c16}}
:root[data-theme="dark"]{--bg:#08121f;--cd:#10233b;--tx:#e8eef8;--mu:#93a4bd;--bd:#223a58;--nv:#050c16}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.login{display:flex;min-height:100%;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b1f3a,#1d5fd0)}
.lbox{background:var(--cd);padding:32px;border-radius:12px;width:min(380px,92vw)}
.logo{background:#fff;border-radius:8px;padding:6px 10px;display:inline-block}.logo img{display:block;height:44px}
h1{font-size:20px;margin:14px 0 4px}.sub{color:var(--mu);font-size:13px;margin:0 0 16px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--cd)}
.btn{background:var(--bl);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:600}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--rd)}.btn.s{padding:4px 9px;font-size:12px}
.err{color:var(--rd);font-size:12px;min-height:16px;margin-top:6px}
#app{display:none;height:100%}#app.on{display:flex}
aside{width:232px;background:var(--nv);color:#cfe0f7;padding:14px 10px;display:flex;flex-direction:column;gap:4px;flex:none;overflow:auto}
aside .logo{margin:0 4px 12px}
aside button{background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:6px}
aside button.a{background:var(--bl);color:#fff}aside button:hover:not(.a){background:rgba(255,255,255,.08)}
main{flex:1;overflow:auto;padding:20px 24px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h2{margin:0;font-size:18px;letter-spacing:.2px}.top p{margin:2px 0 0;color:var(--mu);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar select,.bar input{width:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:16px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px 14px}.k span{font-size:12px;color:var(--mu)}.k b{display:block;font-size:20px;margin-top:2px}
.k.p b{color:var(--gr)}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:16px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:14px;min-width:0}.cd h3{margin:0 0 10px;font-size:14px}
.cd canvas{max-height:260px}.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--mu);font-weight:600}td.n,th.n{text-align:right}
tr.c:hover{background:rgba(29,95,208,.07);cursor:pointer}
.tg{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--bd)}.tg.Active{background:#c9f0e2;color:#065c43}.tg.Inactive{background:#f6d4d0;color:#8a2a1f}.tg.Proposed,.tg.UP{background:#fde9bf;color:#7a5200}
.st{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.st button{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:left}.st button:hover{border-color:var(--bl)}.st b{font-size:18px;display:block}
.note{font-size:12px;color:var(--mu);margin:8px 0}
#mod{position:fixed;inset:0;background:rgba(5,12,22,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}#mod.on{display:flex}
.mb{background:var(--cd);border-radius:10px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
body.pres aside,body.pres .adm,body.pres .bar.nav{display:none}body.pres main{padding:28px 40px}body.pres .k b{font-size:26px}
.pe{position:fixed;right:14px;bottom:14px;display:none;z-index:8}body.pres .pe{display:block}
@media(max-width:760px){#app.on{flex-direction:column}aside{width:auto;flex-direction:row;overflow-x:auto}aside .logo{display:none}.f2{grid-template-columns:1fr}}
</style></head><body>

function login(){const u=USERS[$('#u').value.trim().toLowerCase()];if(!u||u[0]!==$('#p').value){$('#le').textContent='Username or password is incorrect.';return}role=u[1];$('#lg').style.display='none';$('#app').classList.add('on');go('dash')}
function logout(){location.reload()}
function go(v,x){view=v;if(x)S.q=x;$('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]==v?'a':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');V[v]();$('#main').scrollTop=0}
const filt=()=>`<div class="bar nav"><select onchange="S.m=+this.value;save();go(view)"><option value="-1">May–Oct 2026 (6 months)</option>${M.map((m,i)=>`<option value="${i}" ${S.m==i?'selected':''}>${m} 2026</option>`).join('')}</select><select onchange="S.act=+this.value;save();go(view)"><option value="0">All locations (planning)</option><option value="1" ${S.act?'selected':''}>Active franchises only</option></select></div>`;
const head=(t,s,x='')=>`<div class="top"><div><h2>${t}</h2><p>${s}</p></div>${x}</div>`;
const kp=(a,b,c='')=>`<div class="k ${c}"><span>${a}</span><b>${b}</b></div>`;
const proj='<p class="note">All revenue figures are editable planning inputs and illustrative projections, not audited or actual company results.</p>';
function tbl(h,rows,cl){return`<div class="tw"><table><tr>${h.map((x,i)=>`<th class="${i?'n':''}">${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`}
const V={
dash(){const l=sc(),m=ms(),F=fin(agg(l,m)),mm=S.m<0?5:S.m;let g='—';if(mm>0)g=pc((agg(l,[mm])/agg(l,[mm-1])-1)*100);
const st=new Set(l.map(f=>f.state)).size;
$('#main').innerHTML=head('MANNUBHAI SERVICE EXPERT – PAN INDIA BUSINESS CONTROL CENTER','Franchise | Sales | Services | Revenue | Profitability | Business Intelligence',filt())+`<div class="grid">${kp('Total franchise locations',S.fr.length)}${kp('Active franchise locations',S.fr.filter(f=>f.status=='Active').length)}${kp('States covered',st)}${kp('Cities covered',l.length)}${kp('Total revenue',fmt(F.r))}${kp('Services completed',F.n.toLocaleString('en-IN'))}${kp('Avg revenue per service',fmt(F.n?F.r/F.n:0))}${kp('Spare parts revenue',fmt(F.sp))}${kp('Operational expenses',fmt(F.op))}${kp('Stock cost',fmt(F.st))}${kp('Royalty',fmt(F.ry))}${kp('Net profit',fmt(F.np),'p')}${kp('Net profit margin',pc(F.mg),'p')}${kp('Monthly growth',g)}</div>
<div class="cols"><div class="cd"><h3>Monthly revenue and net profit</h3><canvas id="c1"></canvas></div><div class="cd"><h3>Segment-wise revenue</h3><canvas id="c2"></canvas></div><div class="cd"><h3>Top 10 cities by revenue</h3><canvas id="c3"></canvas></div></div>${proj}`;
const mr=M.map((_,i)=>agg(l,[i]));
ck('c1',{type:'bar',data:{labels:M,datasets:[{label:'Revenue',data:mr,backgroundColor:CL[0]},{label:'Net profit',type:'line',data:mr.map(r=>fin(r).np),borderColor:CL[1],tension:.3}]}});
ck('c2',{type:'doughnut',data:{labels:SG.map(s=>s[0]),datasets:[{data:SG.map(s=>F.r*s[1]),backgroundColor:CL}]}});
const t=l.map(f=>[f.city,agg([f],m)]).sort((a,b)=>b[1]-a[1]).slice(0,10);
ck('c3',{type:'bar',data:{labels:t.map(x=>x[0]),datasets:[{label:'Revenue',data:t.map(x=>x[1]),backgroundColor:CL[0]}]},options:{indexAxis:'y'}})},
map(){const by={};S.fr.forEach(f=>(by[f.state]=by[f.state]||[]).push(f));
$('#main').innerHTML=head('India Business Map','State-wise franchise locations. Select a state to see its cities.',filt())+`<div class="st">${Object.keys(by).sort().map(s=>`<button onclick="go('fr','${s}')"><b>${by[s].length}</b>${s}<br><span class="note">${by[s].filter(f=>f.status=='Active').length} active · ${fmt(agg(by[s],ms()))}</span></button>`).join('')}</div><p class="note">Interactive geographic map is planned for the next module; this state view is fully working.</p>`},
fr(){const q=(S.q||'').toLowerCase(),l=S.fr.filter(f=>(f.name+f.city+f.state+f.id).toLowerCase().includes(q));
$('#main').innerHTML=head('Franchise Management',l.length+' of '+S.fr.length+' locations',`<div class="bar"><input placeholder="Search name, city, state, ID" value="${S.q||''}" oninput="S.q=this.value;V.fr();$('#main input').focus()"><button class="btn adm" ${can()?'':'disabled'} onclick="form()">Add franchise</button></div>`)+tbl(['ID / Name','City','State','Owner','Status','Monthly rev (plan)',''],l.map(f=>`<tr><td>${f.id} · ${f.name}</td><td>${f.city}</td><td>${f.state}</td><td>${f.owner||'—'}</td><td><span class="tg ${f.status.replace(/ .*/,'').replace('Under','UP')}">${f.status}</span></td><td class="n">${fmt(f.rev)}</td><td class="adm">${can()?`<button class="btn g s" onclick="form(${f.n})">Edit</button> <button class="btn g s" onclick="del(${f.n})">Delete</button>`:''}</td></tr>`))+`<p class="note">Status options: Active, Inactive, Under Process, Proposed. Locations are not assumed to be operational until marked Active.</p>`},
city(){const m=ms(),r=sc().map(f=>{const F=fin(agg([f],m));return{f,F}}).sort((a,b)=>b.F.np-a.F.np);
$('#main').innerHTML=head('City Reports','Ranked by net profit. Select a city for its detailed report.',filt())+tbl(['#  City','State','Revenue','Services','Net profit','Margin'],r.map((x,i)=>`<tr class="c" onclick="rep(${x.f.n})"><td>${i+1}. ${x.f.city}</td><td>${x.f.state}</td><td class="n">${fmt(x.F.r)}</td><td class="n">${x.F.n}</td><td class="n">${fmt(x.F.np)}</td><td class="n">${pc(x.F.mg)}</td></tr>`))+proj},
six(){const l=sc(),rows=M.map((_,i)=>fin(agg(l,[i]))),T=fin(agg(l,[0,1,2,3,4,5]));
$('#main').innerHTML=head('Six-Month Performance','May 2026 to October 2026 · planning scenario (target about 320 services per franchise per month)',filt())+`<div class="cd">${tbl(['Month','Revenue','Services','Operation','Stock','Royalty','Net profit','Margin'],[...rows.map((F,i)=>`<tr><td>${M[i]} 2026</td>${row(F)}</tr>`),`<tr><td><b>Consolidated</b></td>${row(T)}</tr>`])}</div><div class="cols" style="margin-top:12px"><div class="cd"><h3>Six-month growth</h3><canvas id="c1"></canvas></div><div class="cd"><h3>Cost structure</h3><canvas id="c2"></canvas></div></div>${proj}`;
ck('c1',{type:'line',data:{labels:M,datasets:[{label:'Revenue',data:rows.map(r=>r.r),borderColor:CL[0],fill:true,backgroundColor:'rgba(29,95,208,.15)',tension:.3},{label:'Net profit',data:rows.map(r=>r.np),borderColor:CL[1],tension:.3}]}});
ck('c2',{type:'pie',data:{labels:['Operation','Stock','Royalty','Net profit'],datasets:[{data:[T.op,T.st,T.ry,T.np],backgroundColor:CL}]}})},
cmp(){const o=S.fr.map(f=>`<option value="${f.n}">${f.city}</option>`).join('');S.cp=S.cp||[9,22];
$('#main').innerHTML=head('Comparison','Select up to 5 cities (hold Ctrl or Cmd for several).',filt())+`<select multiple size="8" style="max-width:260px" onchange="S.cp=[...this.selectedOptions].slice(0,5).map(x=>+x.value);V.cmp()">${o.replace(/value="(\d+)"/g,(a,n)=>`value="${n}" ${S.cp.includes(+n)?'selected':''}`)}</select><div class="cols" style="margin-top:12px"><div class="cd"><canvas id="c1"></canvas></div><div class="cd">${tbl(['City','Revenue','Services','Net profit','Margin'],S.cp.map(n=>{const f=S.fr.find(x=>x.n==n),F=fin(agg([f],ms()));return`<tr><td>${f.city}</td><td class="n">${fmt(F.r)}</td><td class="n">${F.n}</td><td class="n">${fmt(F.np)}</td><td class="n">${pc(F.mg)}</td></tr>`}))}</div></div>`;
const ff=S.cp.map(n=>S.fr.find(x=>x.n==n)),FF=ff.map(f=>fin(agg([f],ms())));
ck('c1',{type:'bar',data:{labels:ff.map(f=>f.city),datasets:[{label:'Revenue',data:FF.map(x=>x.r),backgroundColor:CL[0]},{label:'Net profit',data:FF.map(x=>x.np),backgroundColor:CL[1]}]}})},
set(){const c=S.c,fs=[['op','Operation cost %'],['st','Stock cost %'],['ry','Royalty %'],['sp','Spare parts share of revenue %']];
$('#main').innerHTML=head('Settings','Financial assumptions · signed in as '+role)+`<div class="cd" style="max-width:460px">${fs.map(([k,t])=>`<label>${t}</label><input type="number" min="0" max="100" value="${c[k]}" ${can()?'':'disabled'} onchange="S.c.${k}=Math.min(100,Math.max(0,+this.value||0));save();V.set()">`).join('')}<p class="note">Net profit share is ${100-c.op-c.st-c.ry}% of revenue. Default model: 15% operation, 22% stock, 15% royalty, 48% profit.</p>${can()?'<button class="btn r" onclick="if(confirm(\'Reset all data to the initial 180 locations?\')){S=init();save();V.set()}">Reset data</button>':''}</div>`}};
const row=F=>`<td class="n">${fmt(F.r)}</td><td class="n">${F.n.toLocaleString('en-IN')}</td><td class="n">${fmt(F.op)}</td><td class="n">${fmt(F.st)}</td><td class="n">${fmt(F.ry)}</td><td class="n">${fmt(F.np)}</td><td class="n">${pc(F.mg)}</td>`;
function om(h){$('#mb').innerHTML=h;$('#mod').classList.add('on')}function cm(){$('#mod').classList.remove('on')}
function rep(n){const f=S.fr.find(x=>x.n==n),T=fin(agg([f],[0,1,2,3,4,5]));
om(`<div class="top"><div><h2>${f.city}, ${f.state}</h2><p>${f.id} · ${f.status} · six-month planning view</p></div><button class="btn g" onclick="cm()">Close</button></div><div class="grid">${kp('Six-month revenue',fmt(T.r))}${kp('Services',T.n.toLocaleString('en-IN'))}${kp('Net profit',fmt(T.np),'p')}${kp('Margin',pc(T.mg),'p')}</div><canvas id="c9" style="max-height:220px"></canvas>${tbl(['Month','Revenue','Services','Operation','Stock','Royalty','Net profit','Margin'],M.map((m,i)=>`<tr><td>${m}</td>${row(fin(rv(f,i)))}</tr>`))}<p class="note">Segment split: ${SG.map(s=>s[0]+' '+fmt(T.r*s[1])).join(' · ')}. Illustrative projection.</p>`);
ck('c9',{type:'bar',data:{labels:M,datasets:[{label:'Revenue',data:M.map((_,i)=>rv(f,i)),backgroundColor:CL[0]},{label:'Net profit',data:M.map((_,i)=>fin(rv(f,i)).np),backgroundColor:CL[1]}]}})}
function form(n){const f=n?S.fr.find(x=>x.n==n):{name:'',owner:'',phone:'',state:'',city:'',status:'Proposed',rev:300000};
const i=(k,t,ty='text')=>`<div><label>${t}</label><input id="f_${k}" type="${ty}" value="${f[k]}"></div>`;
om(`<h2 style="margin:0 0 8px">${n?'Edit':'Add'} franchise</h2><div class="f2">${i('name','Franchise name')}${i('owner','Owner name')}${i('phone','Contact number (10 digits)')}${i('state','State')}${i('city','City')}${i('rev','Monthly revenue plan (₹)','number')}<div><label>Status</label><select id="f_status">${['Active','Inactive','Under Process','Proposed'].map(s=>`<option ${s==f.status?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="err" id="fe"></div><button class="btn" onclick="sv(${n||0})">Save franchise</button> <button class="btn g" onclick="cm()">Cancel</button>`)}
function sv(n){const g=k=>$('#f_'+k).value.trim(),d={name:g('name'),owner:g('owner'),phone:g('phone'),state:g('state'),city:g('city'),status:g('status'),rev:+g('rev')};
if(!d.name||!d.city||!d.state)return $('#fe').textContent='Name, city and state are required.';if(d.phone&&!/^\d{10}$/.test(d.phone))return $('#fe').textContent='Contact number must be 10 digits.';if(!(d.rev>=0))return $('#fe').textContent='Enter a valid revenue amount.';
if(n)Object.assign(S.fr.find(x=>x.n==n),d);else{const k=Math.max(...S.fr.map(x=>x.n))+1;S.fr.push({...d,n:k,id:'MSE-'+String(k).padStart(3,'0'),mgr:''})}save();cm();V.fr()}
function del(n){if(confirm('Delete this franchise record?')){S.fr=S.fr.filter(x=>x.n!=n);save();V.fr()}}
let tm;const seq=['dash','map','city','six','cmp'];
function pres(on){document.body.classList.toggle('pres',!!on);clearInterval(tm);if(on){try{document.documentElement.requestFullscreen()}catch(e){}let i=0;go(seq[0]);tm=setInterval(()=>go(seq[++i%seq.length]),9000)}else{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}}
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&document.body.classList.contains('pres'))pres(0);if(e.key=='Enter'&&$('#lg').style.display!='none')login()});
</script></body></html>
